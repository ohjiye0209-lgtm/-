<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#FFFDF7">
<meta name="description" content="아인의 2단계 한자 경시대회 모의고사 1·2 정리 노트와 객관식 카드 테스트.">
<title>아인 한자 카드 · 2단계 모의고사 정리</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' x='3' font-size='24'%3E%F0%9F%80%A3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* ================= tokens ================= */
:root{
  --cream:#FFFDF7; --cream-2:#FAF5EB; --cream-3:#F4EDDF;
  --butter:#FFF2B2; --butter-deep:#FDE68A; --butter-ink:#8A6A12;
  --pink:#FFE2EC; --pink-deep:#F9A8D4; --pink-ink:#A23B67;
  --blue:#E0F2FE; --blue-deep:#93C5FD; --blue-ink:#2C5F8A;
  --mint:#DCFCE7; --mint-deep:#86EFAC; --mint-ink:#2F6B45;
  --lilac:#EDE9FE; --lilac-deep:#C4B5FD; --lilac-ink:#5B4B9A;
  --ink:#2D2A32; --muted:#6B6673; --faint:#9A94A0;
  --line:rgba(45,42,50,.085); --line-2:rgba(45,42,50,.14);
  --card:#FFFFFF; --radius:26px; --radius-sm:16px;
  --shadow-sm:0 2px 8px rgba(122,102,80,.06);
  --shadow:0 12px 32px -16px rgba(122,102,80,.28), 0 2px 6px rgba(122,102,80,.05);
  --shadow-lift:0 18px 42px -18px rgba(122,102,80,.35), 0 3px 10px rgba(122,102,80,.06);
  --ok:#4E9A6A; --ok-soft:#EAF7EE; --bad:#C0554A; --bad-soft:#FDECEA;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background:var(--cream);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-.01em; word-break:keep-all; overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; padding-bottom:40px;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(900px 520px at 8% -6%, #FFF4D6 0%, rgba(255,244,214,0) 62%),
    radial-gradient(760px 480px at 102% 4%, #FFEAF1 0%, rgba(255,234,241,0) 60%),
    radial-gradient(800px 600px at 50% 108%, #E9F8EE 0%, rgba(233,248,238,0) 62%),
    var(--cream);
}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
.wrap{max-width:720px; margin:0 auto; padding:20px 16px 0}

/* ================= header ================= */
.brand{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.logo{
  width:42px; height:42px; border-radius:14px; flex:none; display:grid; place-items:center; font-size:22px;
  background:linear-gradient(160deg,#FFF7DC,#FFE7F0); border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow-sm);
}
.brand h1{margin:0; font-size:19px; letter-spacing:-.02em; font-weight:800}
.brand p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}

.hero{
  background:linear-gradient(135deg,#FFF8E4 0%,#FFEFF5 55%,#EFF9F3 100%);
  border:1px solid rgba(255,255,255,.9); border-radius:var(--radius); padding:15px 16px;
  box-shadow:var(--shadow); margin-bottom:14px; position:relative; overflow:hidden;
}
.hero::after{content:"🐣"; position:absolute; right:-4px; bottom:-14px; font-size:70px; opacity:.22; transform:rotate(-8deg)}
.hero b{display:block; font-size:15px; letter-spacing:-.02em}
.hero span{display:block; margin-top:4px; font-size:13px; color:var(--muted); max-width:78%}

/* ================= tabs ================= */
.tabs{display:flex; gap:6px; background:#F5EEE1; padding:5px; border-radius:18px; margin-bottom:14px; box-shadow:inset 0 1px 2px rgba(122,102,80,.06)}
.tabs button{flex:1; padding:10px 8px; border-radius:14px; font-size:13.5px; font-weight:700; color:var(--muted); transition:.18s}
.tabs button.on{background:#fff; color:var(--ink); box-shadow:var(--shadow-sm)}

/* ================= mode chips ================= */
.modes{display:flex; flex-wrap:wrap; gap:7px; padding:2px 2px 10px}
.modes::-webkit-scrollbar{display:none}
.chip{
  flex:none; display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px;
  background:#fff; border:1px solid var(--line-2); font-size:12.5px; font-weight:700; color:var(--muted);
  box-shadow:var(--shadow-sm); transition:.16s; white-space:nowrap;
}
.chip .n{font-size:11px; font-weight:800; color:var(--faint)}
.chip.on{background:var(--ink); border-color:var(--ink); color:#fff}
.chip.on .n{color:rgba(255,255,255,.7)}
.chip:disabled{opacity:.45; cursor:default}
.chip.miss.on{background:var(--pink-ink); border-color:var(--pink-ink)}

/* ================= progress ================= */
.prog{display:flex; align-items:center; gap:10px; margin:2px 2px 12px}
.bar{flex:1; height:9px; border-radius:999px; background:#F0E8DA; overflow:hidden; box-shadow:inset 0 1px 2px rgba(122,102,80,.08)}
.bar i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#FFD9E6,#F9A8D4,#C4B5FD); transition:width .35s cubic-bezier(.4,0,.2,1)}
.pnum{font-size:12px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums; min-width:58px; text-align:right}

/* ================= card ================= */
.card{
  background:var(--card); border:1px solid rgba(255,255,255,.9); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 16px 18px; position:relative;
  animation:pop .32s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.985)}to{opacity:1; transform:none}}
.cardhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px;
  font-size:11.5px; font-weight:800; letter-spacing:-.01em;
  background:var(--blue); color:var(--blue-ink);
}
.badge[data-g="훈음"]{background:var(--butter); color:var(--butter-ink)}
.badge[data-g="문장"]{background:var(--mint); color:var(--mint-ink)}
.badge[data-g="사자성어"]{background:var(--lilac); color:var(--lilac-ink)}
.badge[data-g="뜻"]{background:var(--pink); color:var(--pink-ink)}
.badge[data-g="헷갈림"]{background:#FFE0D9; color:#A6452F}
.star{font-size:12px; color:#E59A2A; font-weight:800}

.stage{
  border-radius:20px; padding:15px 12px; margin-bottom:12px; text-align:center;
  background:linear-gradient(160deg,#FFFDF3,#FFF6E7 70%,#FFF0F6);
  border:1px solid rgba(253,230,138,.55); position:relative;
}
.stage.wide{background:linear-gradient(160deg,#FFFBF4,#FFF1F6); border-color:rgba(249,168,212,.45)}
.hanja{
  font-family:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;
  font-weight:900; font-size:clamp(46px,15.5vw,88px); line-height:1.18; letter-spacing:.06em;
  color:#3B3446; margin:0;
}
.hanja.small{font-size:clamp(28px,9vw,46px); letter-spacing:.04em}
.qtext{margin:0 0 4px; font-size:15.5px; font-weight:700; letter-spacing:-.02em; line-height:1.55}
.qtext .hl{background:linear-gradient(transparent 62%, #FFE9A8 62%); padding:0 2px}
.qsub{margin:6px 0 0; font-size:12.5px; color:var(--muted)}

.choices{display:flex; flex-direction:column; gap:8px}
.choice{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:12px 14px; border-radius:16px; background:#FFFDF9; border:1.5px solid var(--line-2);
  font-size:14.5px; font-weight:600; line-height:1.45; transition:.14s;
}
.choice:hover:not(:disabled){border-color:var(--pink-deep); background:#FFFAFC; transform:translateY(-1px); box-shadow:var(--shadow-sm)}
.choice:disabled{cursor:default}
.choice .k{
  flex:none; width:24px; height:24px; border-radius:9px; display:grid; place-items:center;
  font-size:12px; font-weight:800; color:var(--muted); background:#F6F0E6;
}
.choice .t{flex:1}
.choice .mk{flex:none; font-size:15px; font-weight:900; width:18px; text-align:center}
.choice.correct{border-color:var(--ok); background:var(--ok-soft)}
.choice.correct .k{background:#CDEBD7; color:var(--ok)}
.choice.wrong{border-color:#E8A79F; background:var(--bad-soft)}
.choice.wrong .k{background:#F8D5CF; color:var(--bad)}
.choice.dim{opacity:.5}

.fb{margin-top:14px; border-radius:18px; padding:14px 15px; display:none; animation:pop .26s ease}
.fb.show{display:block}
.fb.ok{background:linear-gradient(160deg,#EFFAF2,#E6F6EC); border:1px solid #CDEBD7}
.fb.no{background:linear-gradient(160deg,#FFF3F0,#FFECEA); border:1px solid #F6D5CF}
.fb h4{margin:0 0 6px; font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:6px}
.fb.ok h4{color:#2F6B45}
.fb.no h4{color:#A6452F}
.fb p{margin:0; font-size:13.5px; line-height:1.62; color:#4A4450}
.fb p .h{font-family:'Noto Serif KR',serif; font-weight:700}
.next{
  margin-top:12px; width:100%; padding:14px; border-radius:16px; font-size:15px; font-weight:800;
  background:var(--ink); color:#fff; box-shadow:var(--shadow); transition:.16s;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.next:hover{transform:translateY(-1px); box-shadow:var(--shadow-lift)}
.ghost{
  width:100%; padding:12px; border-radius:16px; font-size:13.5px; font-weight:800;
  background:#F7F1E7; color:var(--muted); margin-top:8px;
}

/* ================= result ================= */
.result{
  background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 18px;
  text-align:center; animation:pop .3s ease;
}
.ring{
  width:132px; height:132px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center;
  background:conic-gradient(#F9A8D4 var(--deg,0deg), #F3EBDD 0); position:relative;
}
.ring::before{content:""; position:absolute; inset:11px; border-radius:50%; background:#fff; box-shadow:inset 0 2px 8px rgba(122,102,80,.08)}
.ring div{position:relative; text-align:center}
.ring b{display:block; font-size:30px; font-weight:900; letter-spacing:-.03em; line-height:1.1}
.ring span{font-size:11.5px; color:var(--muted); font-weight:700}
.result h3{margin:0 0 4px; font-size:18px; letter-spacing:-.02em}
.result .msg{margin:0 0 16px; font-size:13.5px; color:var(--muted)}
.gbars{text-align:left; display:flex; flex-direction:column; gap:9px; margin:0 0 18px}
.gbar{display:flex; align-items:center; gap:9px; font-size:12.5px}
.gbar .name{width:64px; flex:none; font-weight:800; color:var(--muted)}
.gbar .track{flex:1; height:8px; border-radius:999px; background:#F3EBDD; overflow:hidden}
.gbar .track i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#A7E3BC,#86EFAC)}
.gbar .val{width:42px; text-align:right; font-weight:800; font-variant-numeric:tabular-nums; color:var(--muted)}
.wronglist{text-align:left; display:flex; flex-direction:column; gap:8px; margin-bottom:16px; max-height:320px; overflow:auto}
.wcard{border:1px solid var(--line-2); border-radius:16px; padding:11px 13px; background:#FFFDF9}
.wcard .wtop{display:flex; align-items:center; gap:9px}
.wcard .wh{font-family:'Noto Serif KR',serif; font-weight:900; font-size:22px; letter-spacing:.04em}
.wcard .wa{font-size:12.5px; font-weight:800; color:var(--ok)}
.wcard .we{margin:5px 0 0; font-size:12px; color:var(--muted); line-height:1.5}
.sectitle{text-align:left; margin:0 0 9px; font-size:13px; font-weight:800; color:var(--muted); letter-spacing:-.01em}

/* ================= note ================= */
.note-head{margin:0 2px 12px}
.note-head h2{margin:0 0 4px; font-size:17px; letter-spacing:-.02em}
.note-head p{margin:0; font-size:12.5px; color:var(--muted)}
.note{
  background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:15px 15px 8px;
  margin-bottom:12px; border:1px solid rgba(255,255,255,.9);
}
.note.hot{background:linear-gradient(170deg,#FFF6F2,#FFFDF9 60%); border:1px solid #FBDCD3}
.note h3{margin:0 0 3px; font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:7px}
.note h3 .cnt{font-size:11px; font-weight:800; color:var(--faint); background:#F6F0E6; padding:2px 7px; border-radius:999px}
.note .tip{margin:0 0 10px; font-size:12px; color:var(--muted); line-height:1.5}
.row{display:flex; align-items:flex-start; gap:11px; padding:9px 2px; border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .hj{
  flex:none; min-width:52px; font-family:'Noto Serif KR',serif; font-weight:900; font-size:23px;
  letter-spacing:.02em; color:#3B3446; line-height:1.3;
}
.row .sm{flex:1; min-width:0}
.row .hm{font-size:13.5px; font-weight:800; letter-spacing:-.01em}
.row .hm em{font-style:normal; color:var(--pink-ink)}
.row .mn{font-size:12px; color:var(--muted); margin-top:1px; line-height:1.45}
.row.flag{background:linear-gradient(90deg,#FFF7EE,#FFFDF9); border-radius:12px; border-top-color:transparent}
.row.flag .hj{color:#B4552F}
.row .pin{flex:none; font-size:11px; font-weight:800; color:#B4552F; background:#FFE8DE; padding:2px 7px; border-radius:999px; margin-top:4px}
.footnote{text-align:center; font-size:11.5px; color:var(--faint); margin:18px 0 4px}

@media (min-width:760px){
  .wrap{padding-top:34px}
  .brand h1{font-size:22px}
  .hero{padding:20px 24px}
  .hero::after{font-size:96px; bottom:-22px}
  .card{padding:22px 24px 24px}
  .stage{padding:26px 18px; margin-bottom:18px}
  .qtext{font-size:17px}
  .choice{padding:15px 17px; font-size:15.5px}
  .result{padding:28px 30px}
  .note{padding:20px 20px 10px}
  .row{padding:11px 2px}
  .row .hj{font-size:26px; min-width:64px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="brand">
    <div class="logo">🐣</div>
    <div>
      <h1>아인 한자 카드</h1>
      <p>2단계 한자 경시대회 · 모의고사 1·2 정리</p>
    </div>
  </header>

  <div class="hero">
    <b>카드를 넘기며 한 문제씩 풀어 보자!</b>
    <span>정답을 누르면 바로 O·X와 설명이 나와요. 틀린 문제는 자동으로 모아 두었다가 다시 풀 수 있어요.</span>
  </div>

  <nav class="tabs" role="tablist">
    <button id="tabQuiz" class="on" role="tab" aria-selected="true">🃏 카드 퀴즈</button>
    <button id="tabNote" role="tab" aria-selected="false">📒 정리 노트</button>
  </nav>

  <!-- ===== quiz ===== -->
  <section id="quizView">
    <div class="modes">
      <button class="chip on" data-mode="all">🎯 전체 모드 <span class="n" id="nAll"></span></button>
      <button class="chip" data-mode="weak">🔥 약점 집중 <span class="n" id="nWeak"></span></button>
      <button class="chip miss" data-mode="miss">📌 틀린 문제만 <span class="n" id="nMiss"></span></button>
      <button class="chip" id="shuffleBtn" aria-pressed="false">🔀 순서 섞기</button>
    </div>

    <div class="prog">
      <div class="bar"><i id="barFill"></i></div>
      <span class="pnum" id="pnum">0 / 0</span>
    </div>

    <article class="card" id="card">
      <div class="cardhead">
        <span class="badge" id="badge">독음</span>
        <span class="star" id="star"></span>
      </div>
      <div class="stage" id="stage">
        <p class="hanja" id="hanja">多少</p>
      </div>
      <p class="qtext" id="qtext"></p>
      <p class="qsub" id="qsub"></p>
      <div class="choices" id="choices"></div>
      <div class="fb" id="fb"></div>
    </article>
    <div id="under"></div>
  </section>

  <!-- ===== note ===== -->
  <section id="noteView" hidden>
    <div class="note-head">
      <h2>📒 한자 정리 노트</h2>
      <p>모의고사 1·2에 나온 한자를 뜻끼리 모았어요. 색이 있는 줄은 아인이 시험지에서 다시 본 부분이에요.</p>
    </div>
    <div id="notes"></div>
    <p class="footnote">모의고사 1·2 (2단계) · 총 <span id="noteTotal">0</span>자 정리</p>
  </section>

</div>

<script>
/* =========================================================
   데이터
   ========================================================= */
const Q = [
/* ---- 독음 (한자어 읽기) ---- */
{id:'d01',g:'독음',big:'多少',q:'다음 한자어의 독음으로 알맞은 것은?',c:['다행','다소','대소','동서','도서'],a:1,weak:false,
 e:'<span class="h">多</span>(많을 다) + <span class="h">少</span>(적을 소) → <b>다소</b>. "조금", "약간"이라는 뜻이에요.'},
{id:'d02',g:'독음',big:'山間',q:'다음 한자어의 독음으로 알맞은 것은?',c:['산문','산수','산간','출간','산지'],a:2,weak:false,
 e:'<span class="h">山</span>(뫼 산) + <span class="h">間</span>(사이 간) → <b>산간</b>. 산과 산 사이, 산이 많은 곳이에요.'},
{id:'d03',g:'독음',big:'地方',q:'다음 한자어의 독음으로 알맞은 것은?',c:['토지','토방','지역','지지','지방'],a:4,weak:true,
 e:'<span class="h">地</span>(땅 지) + <span class="h">方</span>(모 방) → <b>지방</b>. "서울 밖의 시골"이나 "어느 한 곳"을 말해요. 地方은 언제나 <b>지방</b>으로 읽어요!'},
{id:'d04',g:'독음',big:'長短',q:'다음 한자어의 독음으로 알맞은 것은?',c:['장소','시단','장안','장단','단문'],a:3,weak:true,
 e:'<span class="h">長</span>(길 장) + <span class="h">短</span>(짧을 단) → <b>장단</b>. 길고 짧음, 또 소리의 길고 짧음이에요.'},
{id:'d05',g:'독음',big:'右向',q:'다음 한자어의 독음으로 알맞은 것은?',c:['우향','좌우','좌항','우왕','우면'],a:0,weak:false,
 e:'<span class="h">右</span>(오른쪽 우) + <span class="h">向</span>(향할 향) → <b>우향</b>. 오른쪽을 향함이에요.'},
{id:'d06',g:'독음',big:'學年',q:'다음 한자어의 독음으로 알맞은 것은?',c:['학교','학생','학년','학자','학사'],a:2,weak:false,
 e:'<span class="h">學</span>(배울 학) + <span class="h">年</span>(해 년) → <b>학년</b>.'},
{id:'d07',g:'독음',big:'白鳥',q:'다음 한자어의 독음으로 알맞은 것은?',c:['백년','백하','명백','백도','백조'],a:4,weak:false,
 e:'<span class="h">白</span>(흰 백) + <span class="h">鳥</span>(새 조) → <b>백조</b>. 흰 새, 고니예요.'},

/* =========================================================
   퀴즈 로직
   ========================================================= */
const LSKEY='hanjaQuizWrong_v1';
const $=s=>document.querySelector(s);
const state={mode:'all',queue:[],idx:0,answered:false,ok:0,wrongNow:[],stats:{},shuffle:false};

function loadMiss(){ try{ const v=JSON.parse(localStorage.getItem(LSKEY)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function saveMiss(a){ try{ localStorage.setItem(LSKEY, JSON.stringify([...new Set(a)])); }catch(e){} }
let missSet=new Set(loadMiss());

const byId=id=>Q.find(q=>q.id===id);

function counts(){
  $('#nAll').textContent=Q.length;
  $('#nWeak').textContent=Q.filter(q=>q.weak).length;
  const n=[...missSet].filter(id=>byId(id)).length;
  $('#nMiss').textContent=n;
  document.querySelector('[data-mode="miss"]').disabled=n===0;
}

function buildQueue(){
  let list;
  if(state.mode==='weak') list=Q.filter(q=>q.weak);
  else if(state.mode==='miss') list=[...missSet].map(byId).filter(Boolean);
  else list=Q.slice();
  if(state.shuffle) list=shuffle(list);
  state.queue=list;
  state.idx=0; state.ok=0; state.wrongNow=[]; state.stats={};
  state.answered=false;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function setMode(m){
  state.mode=m;
  document.querySelectorAll('.chip[data-mode]').forEach(c=>c.classList.toggle('on',c.dataset.mode===m));
  buildQueue(); renderCard();
}

function renderCard(){
  const q=state.queue[state.idx];
  const card=$('#card');
  if(!q){ renderResult(); return; }
  state.answered=false;
  card.style.display='';
  $('#under').innerHTML='';
  $('#badge').textContent=q.g;
  $('#badge').dataset.g=q.g;
  $('#star').textContent=q.weak?'⭐ 다시 볼 문제':'';
  const stage=$('#stage');
  const big=$('#hanja');
  stage.classList.toggle('wide',!!q.wide);
  big.classList.toggle('small',!!q.wide);
  big.textContent=q.big;
  $('#qtext').innerHTML=q.q;
  $('#qsub').textContent=q.sub||'';
  $('#qsub').style.display=q.sub?'':'none';

  const keys=['①','②','③','④','⑤','⑥'];
  const box=$('#choices'); box.innerHTML='';
  q.c.forEach((txt,i)=>{
    const b=document.createElement('button');
    b.className='choice'; b.type='button';
    b.innerHTML='<span class="k">'+keys[i]+'</span><span class="t">'+txt+'</span><span class="mk"></span>';
    b.addEventListener('click',()=>answer(i));
    box.appendChild(b);
  });
  const fb=$('#fb'); fb.className='fb'; fb.innerHTML='';
  const p=$('#barFill'); p.style.width=Math.round(state.idx/state.queue.length*100)+'%';
  $('#pnum').textContent=(state.idx+1)+' / '+state.queue.length;
  counts();
  document.querySelectorAll('.chip[data-mode]').forEach(c=>{
    if(c.dataset.mode==='miss'){ const n=[...missSet].filter(id=>byId(id)).length; c.disabled=n===0; $('#nMiss').textContent=n; }
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function answer(i){
  if(state.answered) return;
  state.answered=true;
  const q=state.queue[state.idx];
  const ok=i===q.a;
  const btns=[...document.querySelectorAll('.choice')];
  btns.forEach((b,n)=>{
    b.disabled=true;
    if(n===q.a){ b.classList.add('correct'); b.querySelector('.mk').textContent='O'; }
    else if(n===i){ b.classList.add('wrong'); b.querySelector('.mk').textContent='X'; }
    else b.classList.add('dim');
  });
  if(!state.stats[q.g]) state.stats[q.g]={n:0,ok:0};
  state.stats[q.g].n++;
  if(ok){ state.ok++; state.stats[q.g].ok++; }
  else{
    state.wrongNow.push(q);
    if(!missSet.has(q.id)){ missSet.add(q.id); saveMiss([...missSet]); }
  }
  const fb=$('#fb');
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML='<h4>'+(ok?'⭕ 정답이에요!':'❌ 아쉬워요!')+'</h4>'+
    (ok?'':'<p style="margin-bottom:8px">정답은 <b>'+q.c[q.a]+'</b> 이에요.</p>')+
    '<p>'+q.e+'</p>';
  const next=document.createElement('button');
  next.className='next'; next.type='button';
  next.innerHTML=(state.idx+1>=state.queue.length)?'결과 보기 ✨':'다음 문제 →';
  next.addEventListener('click',()=>{ state.idx++; if(state.idx>=state.queue.length) renderResult(); else renderCard(); });
  $('#under').innerHTML=''; $('#under').appendChild(next);
  next.focus({preventScroll:true});
  const r=fb.getBoundingClientRect();
  if(r.bottom>window.innerHeight-16) fb.scrollIntoView({behavior:'smooth', block:'center'});
  $('#barFill').style.width=Math.round((state.idx+1)/state.queue.length*100)+'%';
}

function renderResult(){
  const total=state.queue.length;
  const ok=state.ok;
  const pct=total?Math.round(ok/total*100):0;
  $('#card').style.display='none';
  const groups=Object.keys(state.stats);
  const ghtml=groups.map(g=>{
    const s=state.stats[g]; const p=Math.round(s.ok/s.n*100);
    return '<div class="gbar"><span class="name">'+g+'</span><span class="track"><i style="width:'+p+'%"></i></span><span class="val">'+s.ok+'/'+s.n+'</span></div>';
  }).join('');
  const wrongHtml=state.wrongNow.map(q=>{
    return '<div class="wcard"><div class="wtop"><span class="wh">'+q.big+'</span><span class="wa">'+q.c[q.a]+'</span></div><p class="we">'+q.e.replace(/<[^>]+>/g,'')+'</p></div>';
  }).join('');
  const msg = pct>=90?'거의 다 맞았어요! 이제 실제 시험도 문제없어요 🎉'
            : pct>=70?'좋아요! 틀린 문제만 한 번 더 풀면 완벽해요 💪'
            : pct>=40?'절반 넘게 왔어요. 약점 집중 모드로 반복해 봐요 🌱'
            : '괜찮아요, 정리 노트부터 다시 보고 천천히 해 봐요 🐣';
  const box=$('#under');
  box.innerHTML=''+
    '<div class="result">'+
      '<div class="ring" style="--deg:'+(pct*3.6)+'deg"><div><b>'+ok+'<span style="font-size:15px;color:#9A94A0">/'+total+'</span></b><span>'+pct+'점</span></div></div>'+
      '<h3>'+msg+'</h3>'+
      '<p class="msg">'+(state.wrongNow.length?('틀린 문제 '+state.wrongNow.length+'개는 자동으로 저장했어요.'):'틀린 문제가 없어요!')+'</p>'+
      (ghtml?'<p class="sectitle">영역별</p><div class="gbars">'+ghtml+'</div>':'')+
      (state.wrongNow.length?'<p class="sectitle">📌 다시 볼 카드</p><div class="wronglist">'+wrongHtml+'</div>':'')+
      (state.wrongNow.length?'<button class="next" id="retryWrong" type="button">틀린 문제만 다시 풀기 🔁</button>':'')+
      '<button class="next" id="again" type="button" style="margin-top:8px;background:#F7F1E7;color:#2D2A32;box-shadow:none">전체 모드 처음부터</button>'+
      '<button class="ghost" id="toNote" type="button">📒 정리 노트 보기</button>'+
    '</div>';
  $('#barFill').style.width='100%';
  $('#pnum').textContent=total+' / '+total;
  const rw=$('#retryWrong');
  if(rw) rw.addEventListener('click',()=>{ state.mode='miss'; document.querySelectorAll('.chip[data-mode]').forEach(c=>c.classList.toggle('on',c.dataset.mode==='miss')); buildQueue(); if(!state.queue.length){ renderResult(); return;} renderCard(); });
  $('#again').addEventListener('click',()=>{ state.mode='all'; document.querySelectorAll('.chip[data-mode]').forEach(c=>c.classList.toggle('on',c.dataset.mode==='all')); buildQueue(); renderCard(); });
  $('#toNote').addEventListener('click',()=>showTab('note'));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* 키보드: 1~6 선택, Enter 다음 */
document.addEventListener('keydown',e=>{
  if($('#quizView').hidden) return;
  if(/^[1-6]$/.test(e.key)){
    const n=+e.key-1; const btns=document.querySelectorAll('.choice');
    if(btns[n] && !state.answered) btns[n].click();
  }
  if(e.key==='Enter'){ const b=$('#under .next'); if(b){ e.preventDefault(); b.click(); } }
});

/* 탭 */
function showTab(which){
  const quiz=which==='quiz';
  $('#quizView').hidden=!quiz;
  $('#noteView').hidden=quiz;
  $('#tabQuiz').classList.toggle('on',quiz);
  $('#tabNote').classList.toggle('on',!quiz);
  $('#tabQuiz').setAttribute('aria-selected',quiz?'true':'false');
  $('#tabNote').setAttribute('aria-selected',quiz?'false':'true');
  document.querySelector('.hero').style.display=quiz?'':'none';
  window.scrollTo({top:0,behavior:'smooth'});
}
$('#tabQuiz').addEventListener('click',()=>showTab('quiz'));
$('#tabNote').addEventListener('click',()=>showTab('note'));

/* 노트 렌더 */
function renderNotes(){
  const wrap=$('#notes'); let n=0;
  wrap.innerHTML=NOTES.map(sec=>{
    const rows=sec.items.map(it=>{
      const [hj,hm,mn,flag]=it;
      n++;
      return '<div class="row'+(flag?' flag':'')+'">'+
        '<div class="hj">'+hj+'</div>'+
        '<div class="sm"><div class="hm">'+hm+'</div>'+(mn?'<div class="mn">'+mn+'</div>':'')+'</div>'+
        (flag&&!sec.hot?'<span class="pin">다시</span>':'')+
      '</div>';
    }).join('');
    return '<section class="note'+(sec.hot?' hot':'')+'">'+
      '<h3><span>'+sec.emoji+'</span> '+sec.t+' <span class="cnt">'+sec.items.length+'</span></h3>'+
      (sec.tip?'<p class="tip">'+sec.tip+'</p>':'')+rows+'</section>';
  }).join('');
  $('#noteTotal').textContent=n;
}

/* 모드 칩 */
document.querySelectorAll('.chip[data-mode]').forEach(c=>{
  c.addEventListener('click',()=>{ if(c.disabled) return; setMode(c.dataset.mode); });
});
$('#shuffleBtn').addEventListener('click',e=>{
  state.shuffle=!state.shuffle;
  e.currentTarget.classList.toggle('on',state.shuffle);
  e.currentTarget.setAttribute('aria-pressed',state.shuffle?'true':'false');
  buildQueue(); renderCard();
});

/* 시작 */
counts(); buildQueue(); renderCard(); renderNotes();
</script>
</body>
</html>
