document.addEventListener('submit', function(e){
  var f = e.target;
  if(!f || !f.getAttribute) return;
  var kind = f.getAttribute('data-form');
  if(!kind) return;
  e.preventDefault();
  var d = {};
  Array.prototype.forEach.call(f.elements, function(el){
    if(!el.name) return;
    d[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  });
  var t = today();

  if(kind === 'add-todo'){
    var mid = f.getAttribute('data-member');
    if(!canEditTodos(mid)){ denyPerm(); return; }
    var text = String(d.text || '').trim();
    if(!text) return;
    state.todos[mid].push({id:uid('td'), text:text, recurring:!!d.recurring, assigned:t, done:false, doneOn:null, dates:{}, createdAt:Date.now()});
    persist(); render();
    var again = $('form[data-form="add-todo"] input[name="text"]');
    if(again) again.focus();
    toast('할 일을 추가했어요');
  }
  else if(kind === 'save-todo'){
    var m2 = f.getAttribute('data-member');
    if(!canEditTodos(m2)){ denyPerm(); return; }
    var t2 = findTodo(m2, f.getAttribute('data-id'));
    if(t2){
      t2.text = String(d.text || '').trim() || t2.text;
      t2.recurring = !!d.recurring;
      persist();
    }
    closeModal(); render(); toast('수정했어요');
  }
  else if(kind === 'add-study'){
    var kid = f.getAttribute('data-kid');
    if(!canEditStudy(kid)){ denyPerm(); return; }
    var title = String(d.title || '').trim();
    if(!title) return;
    state.study[kid].push({id:uid('st'), subject:d.subject || '기타', title:title, text:title, reward: Math.max(0, Number(d.reward) || 0), recurring:!!d.recurring, assigned:t, done:false, doneOn:null, dates:{}, createdAt:Date.now()});
    persist(); render();
    var again2 = $('form[data-form="add-study"] input[name="title"]');
    if(again2) again2.focus();
    toast('공부 항목을 추가했어요');
  }
  else if(kind === 'save-study'){
    var k2 = f.getAttribute('data-kid');
    if(!canEditStudy(k2)){ denyPerm(); return; }
    var s2 = findStudy(k2, f.getAttribute('data-id'));
    if(s2){
      s2.subject = d.subject || s2.subject;
      s2.title = String(d.title || '').trim() || s2.title || s2.text;
      s2.text = s2.title;
      s2.reward = Math.max(0, Number(d.reward) || 0);
      s2.recurring = !!d.recurring;
      persist();
    }
    closeModal(); render(); toast('수정했어요');
  }
  else if(kind === 'add-tx'){
    var kid3 = f.getAttribute('data-kid');
    if(!canRecordSpend(kid3)){ denyPerm('용돈 기록은 엄마만 남길 수 있어요'); return; }
    var amt = Math.round(Number(d.amount) || 0);
    if(amt <= 0){ toast('금액을 1원 이상 입력해 주세요'); return; }
    var type = (!isAdmin() || d.type !== 'deposit') ? 'spend' : 'deposit';
    state.allowance[kid3].tx.push({id:uid('tx'), type:type, amount:amt, memo:String(d.memo || '').trim(), date:d.date || t, source:null, itemId:null, ts:Date.now()});
    persist(); render();
    toast(type === 'spend' ? won(amt)+' 사용을 기록했어요' : won(amt)+' 입금을 기록했어요');
  }
  else if(kind === 'add-stamp'){
    var kid4 = f.getAttribute('data-kid');
    if(!canEditStamps(kid4)){ denyPerm('도장은 엄마만 찍어줄 수 있어요'); return; }
    var date = f.getAttribute('data-date') || ui.stampSel || t;
    var label = String(d.label || '').trim();
    if(!label) return;
    state.stamps[kid4].push({id:uid('sp'), date:date, label:label, type: d.type === 'habit' ? 'habit' : 'study'});
    persist(); render();
    toast('도장을 찍었어요! 🌟');
  }
  else if(kind === 'add-reward'){
    var kid5 = f.getAttribute('data-kid');
    if(!canEditStamps(kid5)){ denyPerm('보상 목표는 엄마만 정할 수 있어요'); return; }
    var count = Math.max(1, Math.round(Number(d.count) || 10));
    var reward = String(d.reward || '').trim();
    if(!reward) return;
    state.rewards[kid5].push({id:uid('rw'), count:count, reward:reward, claimed:false, createdAt:Date.now()});
    persist(); render(); toast('보상 목표를 추가했어요');
  }
  else if(kind === 'send-chat'){
    var text3 = String(d.text || '').trim();
    if(!text3) return;
    var sender = isAdmin() ? (ui.chatSender || currentUser()) : currentUser();
    state.chat.push({id:uid('ms'), sender:sender, text:text3, ts:Date.now()});
    ui.chatDraft = '';
    persist(); render({focusChat:true});
  }
  else if(kind === 'save-mission'){
    if(!isAdmin()){ denyPerm('미션은 엄마만 정할 수 있어요'); return; }
    var txt = String(d.text || '').trim();
    if(!txt) return;
    state.mission.text = txt;
    state.mission.done = {};
    state.mission.custom = true;
    state.mission.date = t;
    persist(); closeModal(); render();
    toast('오늘의 미션을 정했어요');
  }
  else if(kind === 'add-weight'){
    if(!canEditHealth()){ denyPerm('건강 기록은 엄마만 고칠 수 있어요'); return; }
    var kg = Number(d.kg);
    if(!kg || kg <= 0) return;
    var date2 = d.date || t;
    var dup = state.health.weights.filter(function(w){ return w.date === date2; })[0];
    if(dup){ dup.kg = kg; toast(fmtMD(date2)+' 체중을 '+kg.toFixed(1)+'kg으로 업데이트했어요'); }
    else { state.health.weights.push({id:uid('wt'), date:date2, kg:kg}); toast(kg.toFixed(1)+'kg을 기록했어요'); }
    persist(); render();
  }
  else if(kind === 'add-workout'){
    if(!canEditHealth()){ denyPerm('건강 기록은 엄마만 고칠 수 있어요'); return; }
    var mins = Math.round(Number(d.minutes) || 0);
    if(mins <= 0) return;
    state.health.workouts.push({id:uid('wk'), type:d.type || '기타', minutes:mins, date:d.date || t, note:String(d.note || '').trim()});
    persist(); render();
    toast(mins+'분 운동을 기록했어요');
  }
  else if(kind === 'save-workout'){
    if(!canEditHealth()){ denyPerm('건강 기록은 엄마만 고칠 수 있어요'); return; }
    var w2 = state.health.workouts.filter(function(x){ return x.id === f.getAttribute('data-id'); })[0];
    if(w2){
      w2.type = d.type || w2.type;
      w2.minutes = Math.max(1, Math.round(Number(d.minutes) || w2.minutes));
      w2.date = d.date || w2.date;
      w2.note = String(d.note || '').trim();
      persist();
    }
    closeModal(); render(); toast('수정했어요');
  }
  else if(kind === 'save-start'){
    var kid6 = f.getAttribute('data-kid');
    if(!canEditAllowance(kid6)){ denyPerm('시작 금액은 엄마만 바꿀 수 있어요'); return; }
    var st = Math.round(Number(d.start) || 0);
    if(st < 0) st = 0;
    state.allowance[kid6].start = st;
    persist(); closeModal(); render();
    toast('시작 금액을 '+won(st)+'으로 바꿨어요');
  }
  else if(kind === 'pin-check'){
    var owner = f.getAttribute('data-id');
    var mode = f.getAttribute('data-mode') || 'switch';
    var pin = String(d.pin || '').replace(/\D/g, '');
    var errEl = $('#pinErr');
    var inpEl = $('#pinInput');
    if(pin.length !== 4){
      if(errEl) errEl.textContent = '숫자 4자리를 입력해 주세요';
      if(inpEl){ inpEl.value = ''; try{ inpEl.focus(); }catch(e){} }
      return;
    }
    if(pin !== pinOf(owner)){
      if(errEl) errEl.textContent = 'PIN이 맞지 않아요. 다시 확인해 주세요.';
      if(inpEl){ inpEl.value = ''; try{ inpEl.focus(); }catch(e){} }
      return;
    }
    markPinUnlocked(owner);
    if(mode === 'gate'){
      applyActive(owner, true);
      closeModal();
      render({top:true});
      toast(M[owner].name + ' 프로필로 들어왔어요');
      return;
    }
    doSwitch(f.getAttribute('data-switch') || owner);
  }
  else if(kind === 'save-pin'){
    if(!isAdmin()){ denyPerm('PIN은 엄마만 정할 수 있어요'); return; }
    var pid = f.getAttribute('data-id');
    var np = String(d.pin || '').replace(/\D/g, '');
    var e1 = $('#pinErr');
    if(np.length !== 4){ if(e1) e1.textContent = '숫자 4자리를 입력해 주세요'; return; }
    state.pins[pid] = np;
    persist();
    openProfileModal();
    toast(M[pid].name + ' PIN을 정했어요');
  }
});

document.addEventListener('input', function(e){

    var v = String(e.target.value || '').replace(/\D/g, '');
    if(v !== e.target.value) e.target.value = v;
    var fm = e.target.closest ? e.target.closest('form') : null;

      fm.dispatchEvent(new Event('submit', {cancelable:true, bubbles:true}));

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(ui.gate) return;
    if($('#modalRoot') && $('#modalRoot').innerHTML) closeModal();
    else { var dr = $('#drawerRoot'); if(dr && dr.innerHTML) dr.innerHTML = ''; }
  }
  if(e.target && e.target.id === 'chatInput' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    var f = e.target.closest('form');
    if(f) f.dispatchEvent(new Event('submit', {cancelable:true, bubbles:true}));
  }
});

/* ------------------------- boot ------------------------- */
function boot(){
  loadState();
  ensureMissionToday();
  var wanted = null;
  try{
    wanted = resolveMe(new URLSearchParams(location.search).get('me'));
  }catch(e){ wanted = null; }
  if(wanted){
    if(hasPin(wanted) && !pinUnlockedRecently(wanted)){
      /* fixed link to a PIN-protected profile: ask before anything is shown */
      ui.gate = wanted;
    } else {
      applyActive(wanted, true);
    }
  }
  ui.tab = (state.lastTab && TAB_MAP[state.lastTab]) ? state.lastTab : 'home';
  if(location.hash){
    var h = location.hash.slice(1);
    if(TAB_MAP[h]) ui.tab = h;
  }
  ui.chatSender = ui.chatSender || currentUser();
  ui.stampMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  ui.stampSel = today();
  render({top:true});
  loadWeather();
  if(ui.gate) showPinGate(ui.gate);
  // keep date-sensitive views fresh past midnight
  setInterval(function(){
    if(state.mission.date !== today()){ ensureMissionToday(); render(); }
  }, 60000);
}
var lastW = window.innerWidth;
window.addEventListener('resize', function(){
  var w = window.innerWidth;
  if((lastW < 700) !== (w < 700) || Math.abs(w - lastW) > 120){
    lastW = w;
    if(ui.tab === 'health') render();
  }
});
window.addEventListener('hashchange', function(){
  var h = location.hash.slice(1);
  if(TAB_MAP[h] && h !== ui.tab){ ui.tab = h; state.lastTab = h; persist(); render({top:true}); }
});
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();

</script>
</body>
</html>
